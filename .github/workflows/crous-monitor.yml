name: CROUS Monitor

on:
  schedule:
    # Every 5 minutes, shifted away from :00 to reduce peak cron congestion.
    # Five minutes is GitHub Actions' minimum supported schedule interval.
    - cron: "2-59/5 * * * *"
  # Allow running the workflow by hand from the Actions tab.
  workflow_dispatch: {}

# Required so the workflow can commit the updated state.json back to the repo.
permissions:
  contents: write

# Prevent two runs from pushing state at the same time.
concurrency:
  group: crous-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: >-
          pip install --disable-pip-version-check --no-input --no-compile
          --only-binary=:all: -r requirements.txt

      - name: Run CROUS monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          # Optional compatibility/key-rotation secrets; /start handles all
          # normal subscriptions without a configured chat id.
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SUBSCRIBER_ENCRYPTION_KEY: ${{ secrets.SUBSCRIBER_ENCRYPTION_KEY }}
        run: python crous_bot.py

      - name: Persist state
        if: always()
        run: |
          if [[ -n "$(git status --porcelain state.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "chore: update CROUS monitoring state [skip ci]"
            # Retry once in case another run pushed in the meantime.
            git push || (git pull --rebase --autostash && git push)
          else
            echo "No state change; nothing to commit."
          fi
